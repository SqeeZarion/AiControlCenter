name: aicontrolcenter

x-dotnet-service: &dotnet-service
  restart: "on-failure:3"
  networks:
    - aicontrolcenter
  environment: &dotnet-environment
    DOTNET_ENVIRONMENT: Development
    ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

x-http-healthcheck: &http-healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 10s

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/ai-control-center-angular/Dockerfile
    restart: "on-failure:3"
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      aicontrolcenter:
        ipv4_address: 172.31.0.10
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]

  gateway:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/Gateway/AiControlCenter.Gateway/Dockerfile
    environment:
      <<: *dotnet-environment
      ASPNETCORE_URLS: http://+:8080
      Authentication__PublicKeyPath: /run/aicontrolcenter-keys/identity-public.pem
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PUBLIC_KEY_PATH:-./secrets/identity/identity-public.pem}
        target: /run/aicontrolcenter-keys/identity-public.pem
        read_only: true
    depends_on:
      identity-api:
        condition: service_healthy
      controlplane-api:
        condition: service_healthy
      orchestrator-api:
        condition: service_healthy
      integrations-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5080:8080"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
    networks:
      aicontrolcenter:
        ipv4_address: 172.31.0.20

  identity-data-protection-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        chown -R 1654:1654 /var/lib/aicontrolcenter/data-protection
        chmod 700 /var/lib/aicontrolcenter/data-protection
        find /var/lib/aicontrolcenter/data-protection -maxdepth 1 -type f -exec chmod 600 {} \;
    volumes:
      - identity_data_protection:/var/lib/aicontrolcenter/data-protection
    networks:
      - aicontrolcenter

  integrations-data-protection-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: ["sh", "-ec", "chown -R 1654:1654 /var/lib/aicontrolcenter/data-protection && chmod 700 /var/lib/aicontrolcenter/data-protection && find /var/lib/aicontrolcenter/data-protection -maxdepth 1 -type f -exec chmod 600 {} \\;"]
    volumes:
      - integrations_data_protection:/var/lib/aicontrolcenter/data-protection
    networks:
      - aicontrolcenter

  identity-migrations:
    <<: *dotnet-service
    restart: "no"
    build:
      context: .
      dockerfile: src/Services/Identity/AiControlCenter.Identity.Api/Dockerfile
    command: ["--migrate"]
    environment:
      <<: *dotnet-environment
      ConnectionStrings__IdentityDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${IDENTITY_DB_USER};Password=${IDENTITY_DB_PASSWORD};Search Path=identity"
    depends_on:
      postgres:
        condition: service_healthy

  identity-api:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/Services/Identity/AiControlCenter.Identity.Api/Dockerfile
    environment:
      <<: *dotnet-environment
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdentityDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${IDENTITY_DB_USER};Password=${IDENTITY_DB_PASSWORD};Search Path=identity"
      Authentication__PublicKeyPath: /run/aicontrolcenter-keys/identity-public.pem
      JwtSigning__PrivateKeyPath: /run/aicontrolcenter-keys/identity-private.pem
      DataProtection__KeysPath: /var/lib/aicontrolcenter/data-protection
      IdentityBootstrap__Email: ${IDENTITY_BOOTSTRAP_EMAIL:-}
      IdentityBootstrap__TemporaryPassword: ${IDENTITY_BOOTSTRAP_TEMPORARY_PASSWORD:-}
      IdentityBootstrap__DisplayName: ${IDENTITY_BOOTSTRAP_DISPLAY_NAME:-Platform Administrator}
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PRIVATE_KEY_PATH:-./secrets/identity/identity-private.pem}
        target: /run/aicontrolcenter-keys/identity-private.pem
        read_only: true
      - type: bind
        source: ${IDENTITY_JWT_PUBLIC_KEY_PATH:-./secrets/identity/identity-public.pem}
        target: /run/aicontrolcenter-keys/identity-public.pem
        read_only: true
      - identity_data_protection:/var/lib/aicontrolcenter/data-protection
    depends_on:
      identity-migrations:
        condition: service_completed_successfully
    ports:
      - "5101:8080"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]

  controlplane-migrations:
    <<: *dotnet-service
    restart: "no"
    build:
      context: .
      dockerfile: src/Services/ControlPlane/AiControlCenter.ControlPlane.Api/Dockerfile
    command: ["--migrate"]
    environment:
      <<: *dotnet-environment
      ConnectionStrings__ControlPlaneDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${CONTROLPLANE_DB_USER};Password=${CONTROLPLANE_DB_PASSWORD};Search Path=control_plane"
      Authentication__PublicKeyPath: /run/aicontrolcenter-keys/identity-public.pem
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PUBLIC_KEY_PATH:-./secrets/identity/identity-public.pem}
        target: /run/aicontrolcenter-keys/identity-public.pem
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy

  controlplane-api:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/Services/ControlPlane/AiControlCenter.ControlPlane.Api/Dockerfile
    environment:
      <<: *dotnet-environment
      ConnectionStrings__ControlPlaneDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${CONTROLPLANE_DB_USER};Password=${CONTROLPLANE_DB_PASSWORD};Search Path=control_plane"
      Authentication__PublicKeyPath: /run/aicontrolcenter-keys/identity-public.pem
      IntegrationsGrpc__Address: http://integrations-api:8081
      WorkerGrpc__ApiKey: ${WORKER_GRPC_API_KEY:-}
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PUBLIC_KEY_PATH:-./secrets/identity/identity-public.pem}
        target: /run/aicontrolcenter-keys/identity-public.pem
        read_only: true
    depends_on:
      controlplane-migrations:
        condition: service_completed_successfully
      integrations-api:
        condition: service_healthy
    ports:
      - "5102:8080"
      - "5103:8081"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]

  orchestrator-migrations:
    <<: *dotnet-service
    restart: "no"
    build:
      context: .
      dockerfile: src/Services/Orchestrator/AiControlCenter.Orchestrator.Api/Dockerfile
    command: ["--migrate"]
    environment:
      <<: *dotnet-environment
      ConnectionStrings__OrchestratorDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${ORCHESTRATOR_DB_USER};Password=${ORCHESTRATOR_DB_PASSWORD};Search Path=orchestrator"
      Authentication__PublicKeyPath: /run/aicontrolcenter-keys/identity-public.pem
      WorkerGrpc__ApiKey: ${WORKER_GRPC_API_KEY:-}
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PUBLIC_KEY_PATH:-./secrets/identity/identity-public.pem}
        target: /run/aicontrolcenter-keys/identity-public.pem
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator-api:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/Services/Orchestrator/AiControlCenter.Orchestrator.Api/Dockerfile
    environment:
      <<: *dotnet-environment
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OrchestratorDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${ORCHESTRATOR_DB_USER};Password=${ORCHESTRATOR_DB_PASSWORD};Search Path=orchestrator"
      ControlPlane__GrpcAddress: http://controlplane-api:8081
      IntegrationsGrpc__Address: http://integrations-api:8081
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Authentication__PublicKeyPath: /run/aicontrolcenter-keys/identity-public.pem
      WorkerGrpc__ApiKey: ${WORKER_GRPC_API_KEY:-}
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PUBLIC_KEY_PATH:-./secrets/identity/identity-public.pem}
        target: /run/aicontrolcenter-keys/identity-public.pem
        read_only: true
    depends_on:
      orchestrator-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      controlplane-api:
        condition: service_healthy
    ports:
      - "5104:8080"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]

  worker-service:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/Services/Worker/AiControlCenter.Worker.Service/Dockerfile
    environment:
      <<: *dotnet-environment
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      OrchestratorGrpc__Address: http://orchestrator-api:8081
      OrchestratorGrpc__ApiKey: ${WORKER_GRPC_API_KEY:-}
      IntegrationsGrpc__Address: http://integrations-api:8081
      IntegrationsGrpc__ApiKey: ${WORKER_GRPC_API_KEY:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      orchestrator-api:
        condition: service_healthy
      integrations-api:
        condition: service_healthy
    ports:
      - "5106:8080"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]

  integrations-migrations:
    <<: *dotnet-service
    restart: "no"
    build:
      context: .
      dockerfile: src/Services/Integrations/AiControlCenter.Integrations.Api/Dockerfile
    command: ["--migrate"]
    environment:
      <<: *dotnet-environment
      ConnectionStrings__IntegrationsDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${INTEGRATIONS_DB_USER};Password=${INTEGRATIONS_DB_PASSWORD};Search Path=integrations"
      Authentication__PublicKeyPath: /run/aicontrolcenter-keys/identity-public.pem
      DataProtection__KeysPath: /var/lib/aicontrolcenter/data-protection
      InternalGrpc__ApiKey: ${WORKER_GRPC_API_KEY:-}
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PUBLIC_KEY_PATH:-./secrets/identity/identity-public.pem}
        target: /run/aicontrolcenter-keys/identity-public.pem
        read_only: true
      - integrations_data_protection:/var/lib/aicontrolcenter/data-protection
    depends_on:
      postgres:
        condition: service_healthy
      integrations-data-protection-init:
        condition: service_completed_successfully

  integrations-api:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/Services/Integrations/AiControlCenter.Integrations.Api/Dockerfile
    environment:
      <<: *dotnet-environment
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IntegrationsDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DATABASE};Username=${INTEGRATIONS_DB_USER};Password=${INTEGRATIONS_DB_PASSWORD};Search Path=integrations"
      Authentication__PublicKeyPath: /run/aicontrolcenter-keys/identity-public.pem
      DataProtection__KeysPath: /var/lib/aicontrolcenter/data-protection
      InternalGrpc__ApiKey: ${WORKER_GRPC_API_KEY:-}
      ProviderConnectionFeatures__GitHubCopilotOAuthEnabled: ${GITHUB_COPILOT_OAUTH_ENABLED:-false}
      ProviderConnectionFeatures__GitHubCopilotPatEnabled: ${GITHUB_COPILOT_PAT_ENABLED:-false}
      ProviderConnectionFeatures__LocalCopilotCliEnabled: ${LOCAL_COPILOT_CLI_ENABLED:-false}
      Providers__GitHub__Enabled: ${GITHUB_COPILOT_OAUTH_ENABLED:-false}
      Providers__GitHub__ClientId: ${GITHUB_COPILOT_CLIENT_ID:-}
      Providers__GitHub__ClientSecret: ${GITHUB_COPILOT_CLIENT_SECRET:-}
      Providers__GitHub__CallbackUrl: ${GITHUB_COPILOT_CALLBACK_URL:-http://localhost:8080/api/integrations/v1/provider-connections/github/oauth/callback}
      Providers__LocalCopilotCli__Enabled: ${LOCAL_COPILOT_CLI_ENABLED:-false}
      Providers__LocalCopilotCli__Endpoint: local-copilot-cli:4321
      Providers__LocalCopilotCli__ManagementEndpoint: http://local-copilot-cli:4322
      Providers__LocalCopilotCli__ConnectionToken: ${LOCAL_COPILOT_CLI_CONNECTION_TOKEN:-}
      Providers__LocalCopilotCli__OwnerUserId: ${LOCAL_COPILOT_CLI_OWNER_USER_ID:-00000000-0000-0000-0000-000000000000}
      Providers__LocalCopilotCli__RequestTimeoutSeconds: ${LOCAL_COPILOT_CLI_REQUEST_TIMEOUT_SECONDS:-120}
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PUBLIC_KEY_PATH:-./secrets/identity/identity-public.pem}
        target: /run/aicontrolcenter-keys/identity-public.pem
        read_only: true
      - integrations_data_protection:/var/lib/aicontrolcenter/data-protection
    depends_on:
      integrations-migrations:
        condition: service_completed_successfully
    ports:
      - "5105:8080"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && IFS= read -r status <&3 && [[ \"$$status\" == *\" 200 \"* ]]"]

  local-copilot-cli:
    profiles: ["local-copilot"]
    image: aicontrolcenter-local-copilot-cli
    build:
      context: .
      dockerfile: docker/copilot-cli/Dockerfile
      args:
        COPILOT_CLI_VERSION: "1.0.103"
    restart: "on-failure:3"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      COPILOT_HOME: /var/lib/copilot
      COPILOT_CONNECTION_TOKEN: ${LOCAL_COPILOT_CLI_CONNECTION_TOKEN:-}
      COPILOT_AUTO_UPDATE: "false"
      COPILOT_PLUGIN_DIR_ONLY: "true"
    volumes:
      - local_copilot_home:/var/lib/copilot
    tmpfs:
      - /tmp:uid=1654,gid=1654,mode=0700
    networks:
      - aicontrolcenter
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4322 &&
          printf 'GET /health HTTP/1.0\r\nHost: localhost\r\nX-AiControlCenter-Local-Copilot-Token: %s\r\n\r\n' "$${COPILOT_CONNECTION_TOKEN}" >&3 &&
          IFS= read -r status <&3 && [[ "$${status}" == *" 200 "* ]]

  postgres:
    image: postgres:17.5-alpine
    restart: "on-failure:3"
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CONTROLPLANE_DB_USER: ${CONTROLPLANE_DB_USER}
      CONTROLPLANE_DB_PASSWORD: ${CONTROLPLANE_DB_PASSWORD}
      ORCHESTRATOR_DB_USER: ${ORCHESTRATOR_DB_USER}
      ORCHESTRATOR_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD}
      INTEGRATIONS_DB_USER: ${INTEGRATIONS_DB_USER}
      INTEGRATIONS_DB_PASSWORD: ${INTEGRATIONS_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - aicontrolcenter
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    restart: "on-failure:3"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - aicontrolcenter
    healthcheck:
      interval: 5s
      timeout: 30s
      retries: 20
      start_period: 10s
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]

networks:
  aicontrolcenter:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  postgres_data:
  rabbitmq_data:
  identity_data_protection:
  integrations_data_protection:
  local_copilot_home:
