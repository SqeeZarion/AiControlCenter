<main>
  <header>
    <div>
      <p class="eyebrow">Authenticated control center</p>
      <h1>AiControlCenter</h1>
      <p class="subtitle">{{ auth.user()?.displayName }} · {{ auth.user()?.roles?.join(', ') }}</p>
    </div>
    <div class="header-actions">
      <app-connection-status [connected]="realtime.isConnected()" />
      <button type="button" (click)="logout()">Вийти</button>
    </div>
  </header>

  <nav aria-label="Основна навігація">
    <a routerLink="/directions" routerLinkActive="active">Напрямки</a>
    <span>{{
      gateway()?.service ?? (checked() ? 'Gateway unavailable' : 'Checking gateway…')
    }}</span>
  </nav>
  <router-outlet />
</main>
